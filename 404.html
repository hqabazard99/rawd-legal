<meta name="color-scheme" content="light dark">

<style>:root {
  --bg: #F6F2E9;
  --surface: #FFFFFF;

  --primary: #0C6B51;

}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #080C0A;
    --surface: #121915;
    --text: #F1EEE4;
    --muted: #9DA8A1;
    --primary: #35B189;
    --accent: #D4B26B;
    --border: #232E28;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
body[dir="rtl"] {
  font-family: "SF Arabic", "Segoe UI", "Noto Naskh Arabic", "Geeza Pro", Tahoma, sans-serif;
  line-height: 1.9;
}
.wrap { max-width: 46rem; margin: 0 auto; padding: 2rem 1.25rem 5rem; }
header.top {
  display: flex; align-items: center; justify-content: space-between;
  gap: 1rem; flex-wrap: wrap; margin-bottom: 2.5rem;
}
.brand { display: flex; align-items: center; gap: .6rem; text-decoration: none; color: inherit; }
.mark {
  width: 34px; height: 34px; border-radius: 9px; flex: none;
  background: var(--primary); color: #fff;
  display: grid; place-items: center; font-weight: 700; font-size: 15px;
}
.brand b { font-size: 1.05rem; letter-spacing: -.01em; }
.langs { display: flex; gap: .25rem; padding: .25rem; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
.langs button {
  font: inherit; font-size: .85rem; padding: .4rem .85rem; border: 0; border-radius: 7px;
  background: transparent; color: var(--muted); cursor: pointer;
}
.langs button[aria-pressed="true"] { background: var(--primary); color: #fff; }
.langs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1 { font-size: 1.9rem; line-height: 1.25; letter-spacing: -.02em; margin: 0 0 .4rem; }
h2 { font-size: 1.15rem; margin: 2.5rem 0 .6rem; letter-spacing: -.01em; }
h3 { font-size: 1rem; margin: 1.6rem 0 .4rem; }
.updated { color: var(--muted); font-size: .9rem; margin: 0 0 2rem; }
p, li { color: var(--text); }
ul { padding-inline-start: 1.25rem; }
li { margin: .4rem 0; }
a { color: var(--primary); text-underline-offset: 3px; }
strong { font-weight: 600; }
.note {
  background: var(--surface); border: 1px solid var(--border);
  border-inline-start: 3px solid var(--accent);
  border-radius: 10px; padding: 1rem 1.15rem; margin: 1.5rem 0;
}
.note p:first-child { margin-top: 0; }
.note p:last-child { margin-bottom: 0; }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 1.25rem; margin: 1rem 0;
}
.cards { display: grid; gap: .85rem; margin-top: 2rem; }
a.card { display: block; text-decoration: none; color: inherit; }
a.card:hover { border-color: var(--primary); }
a.card b { display: block; color: var(--primary); margin-bottom: .2rem; }
a.card span { color: var(--muted); font-size: .92rem; }
.mail { font-size: 1.05rem; font-weight: 600; word-break: break-all; }
footer {
  margin-top: 4rem; padding-top: 1.5rem; border-top: 1px solid var(--border);
  color: var(--muted); font-size: .88rem;
  display: flex; gap: 1.25rem; flex-wrap: wrap;
}
footer a { color: var(--muted); }
[data-lang] { display: none; }
[data-lang].on { display: block; }</style>
</head>

<!-- Read by the language toggle to retitle the document. Lives in <body>
     because <span> is not valid inside <head>. -->
<span hidden data-title-en="Page not found · RAWD" data-title-ar="الصفحة غير موجودة · رَوْض"></span>
<div class="wrap">
  <header class="top">
    <a class="brand" href=""><span class="mark">R</span><b>RAWD · رَوْض</b></a>
    <div class="langs" role="group" aria-label="Language / اللغة">
      <button type="button" data-set="en" aria-pressed="true">English</button>
      <button type="button" data-set="ar" aria-pressed="false">العربية</button>
    </div>
  </header>

  <main>
    <div data-lang="en" class="on">
<h1>Page not found</h1>
<p class="updated">That page does not exist.</p>
<div class="cards">
  <a class="card" href="../"><b>Go to the index</b><span>Privacy, Terms and Support.</span></a>

</div>
    <div data-lang="ar">

  <a class="card" href="../"><b>العودة إلى الفهرس</b><span>الخصوصية والشروط والدعم.</span></a>

  </footer>
</div>
<script>(function () {
  var KEY = 'rawd-legal-lang';
  function pick() {
    var q = new URLSearchParams(location.search).get('lang');
    if (q === 'ar' || q === 'en') return q;
    try { var s = localStorage.getItem(KEY); if (s) return s; } catch (e) {}
    return (navigator.language || 'en').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en';
  }
  function apply(lang) {
    var rtl = lang === 'ar';
    document.documentElement.lang = lang;
    document.documentElement.dir = rtl ? 'rtl' : 'ltr';
    document.body.dir = rtl ? 'rtl' : 'ltr';
    var blocks = document.querySelectorAll('[data-lang]');
    for (var i = 0; i < blocks.length; i++) {
      blocks[i].classList.toggle('on', blocks[i].getAttribute('data-lang') === lang);
    }
    var btns = document.querySelectorAll('.langs button');
    for (var j = 0; j < btns.length; j++) {
      btns[j].setAttribute('aria-pressed', String(btns[j].dataset.set === lang));
    }
    var t = document.querySelector('[data-title-' + lang + ']');
    if (t) document.title = t.getAttribute('data-title-' + lang);
    try { localStorage.setItem(KEY, lang); } catch (e) {}
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('.langs button');
    if (b) apply(b.dataset.set);
  });
  apply(pick());
})();</script>
</body>
